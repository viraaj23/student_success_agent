<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPath | Student Success Agent</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside class="sidebar">
    <h2 class="logo">🎓 Success Agent</h2>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="campusflow.html">CampusFlow</a>
      <a href="skillpath.html" class="active">SkillPath</a>
      <a href="internships.html">InternshipHunter</a>
      <a href="planner.html">Weekly Planner</a>
      <a href="progress.html">Progress</a>
    </nav>
  </aside>

  <main class="content">
    <h1>SkillPath 🚀</h1>
    <p class="muted">Know your skills, find the gaps, follow the roadmap.</p>

    <div class="role-pick">
      <label for="role">Target role:</label>
      <select id="role"></select>
    </div>

    <section class="grid">
      <div class="card">
        <h3>Your Skills vs Required</h3>
        <div id="skills"></div>
      </div>

      <div class="card">
        <h3>Skill Gaps</h3>
        <ul class="list" id="gaps"></ul>
      </div>

      <div class="card full">
        <h3>🗺️ Learning Roadmap</h3>
        <div class="progress-row">
          <div class="bar"><div class="bar-fill" id="roadmapBar"></div></div>
          <span class="muted" id="roadmapText"></span>
        </div>
        <ul class="list" id="roadmap"></ul>
      </div>
    </section>
  </main>

  <script src="js/skillpath.js"></script>
</body>
</html>
